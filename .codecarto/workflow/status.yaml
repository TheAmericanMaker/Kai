project_name: "Kai"
pipeline: workflow/pipeline.yaml
current_phase: protocols
last_updated: "2026-05-06"
phases:
  architecture:
    status: complete
    owner_notes:
      - Mapped a Kotlin Multiplatform / Compose Multiplatform application across 5 targets (Android, iOS, JVM Desktop, WASM Web — plus the iOS Xcode shell). 3 Gradle modules and one out-of-tree iOS shell.
      - Two surprise findings worth pinning in contracts — SAF binds are delegated to the FileKit library (no direct SAF code), and the project deliberately does NOT request battery whitelist (`REQUEST_IGNORE_BATTERY_OPTIMIZATIONS` absent), relying on `START_STICKY` + `MainActivity.onStart()` re-assertion to mitigate OEM kills.
      - Linux sandbox is Android-only by design; every other target ships `NoOpSandboxController`.
    outputs_present:
      - findings/architecture/architecture-map.md
    open_questions:
      - id: arch-OQ1
        kind: needs-runtime-test
        description: "`LinuxSandboxManager.makeWritable()` symlink behavior."
        deferred_reason: Not load-bearing for the architecture map; relevant to defect-scan if that pipeline runs later.
      - id: arch-OQ2
        kind: needs-maintainer-decision
        description: "`:screenshotTests` local-vs-CI runnability is unclear from Gradle config alone."
        deferred_reason: Not load-bearing for porting.
    carry_forward: []  # closed by contracts phase
