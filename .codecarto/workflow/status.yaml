    status: complete
    owner_notes:
      - Pinned user-visible behavior across Compose UI surfaces and gave each focus subsystem a full feature-contract table. All four architecture-routed carry_forward entries are explicitly closed in §Carry-Forward Closure of behavioral-contracts.md.
      - Two deliberate non-features pinned as first-class contracts — no persistent SAF grants and no battery-whitelist request; mitigation lives in the FGS layer.
      - Wire-format detail intentionally deferred to protocols via three new carry_forward entries.
    outputs_present:
